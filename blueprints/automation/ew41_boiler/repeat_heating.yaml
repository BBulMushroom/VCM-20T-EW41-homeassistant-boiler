blueprint:
  name: EW41 방별 반복난방
  description: >-
    설정한 주기·시간 동안 방별 난방을 반복합니다. 켜면 즉시 시작하고, 끄면 종료합니다.
    본체 예약은 자동 해제됩니다. 수동 제어·자동화 해제 전 반복난방을 끄세요.
    HA 정지·통신 장애 시 자동 종료가 안 됩니다.
  domain: automation
  homeassistant:
    min_version: "2025.6.0"
  input:
    thermostat:
      name: 방 온도조절기
      selector:
        entity:
          filter:
            integration: ew41_boiler
            domain: climate
    reservation:
      name: 같은 방의 본체 예약 스위치
      selector:
        entity:
          filter:
            integration: ew41_boiler
            domain: switch
    enabled:
      name: 반복난방 스위치
      description: 토글 도우미를 선택하세요. 처음에는 OFF로 두세요.
      selector:
        entity:
          filter:
            domain: input_boolean
    cycle_start:
      name: 주기 시작 시각
      description: 날짜와 시간을 모두 켠 도우미를 선택하세요.
      selector:
        entity:
          filter:
            domain: input_datetime
    interval_hours:
      name: 반복 주기
      description: 가동 시작부터 다음 시작까지의 간격입니다.
      default: 2
      selector:
        number:
          min: 1
          max: 24
          step: 1
          unit_of_measurement: 시간
          mode: box
    run_minutes:
      name: 가동 시간
      default: 10
      selector:
        number:
          min: 1
          max: 59
          step: 1
          unit_of_measurement: 분
          mode: box
    interval_hours_helper:
      name: 주기 숫자 도우미 (선택)
      description: 1~24시간, 1시간 단위. 연결하면 위 주기를 대체합니다.
      default: ""
      selector:
        entity:
          filter:
            domain: input_number
    run_minutes_helper:
      name: 가동 시간 숫자 도우미 (선택)
      description: 1~59분, 1분 단위. 연결하면 위 가동 시간을 대체합니다.
      default: ""
      selector:
        entity:
          filter:
            domain: input_number
mode: queued
max: 5
max_exceeded: silent
variables:
  thermostat: !input thermostat
  reservation: !input reservation
  enabled: !input enabled
  cycle_start: !input cycle_start
  fixed_interval_hours: !input interval_hours
  fixed_run_minutes: !input run_minutes
  interval_hours_helper: !input interval_hours_helper
  run_minutes_helper: !input run_minutes_helper
  interval_hours: >-
    {{ states(interval_hours_helper) | int(0) if interval_hours_helper
       else fixed_interval_hours | int }}
  run_minutes: >-
    {{ states(run_minutes_helper) | int(0) if run_minutes_helper
       else fixed_run_minutes | int }}
triggers:
  - trigger: state
    entity_id: !input enabled
    from: "off"
    to: "on"
    id: enable
  - trigger: state
    entity_id: !input enabled
    from: "on"
    to: "off"
    id: disable
  - trigger: time_pattern
    seconds: "/10"
    id: tick
  - trigger: homeassistant
    event: start
    id: startup
  - trigger: state
    entity_id: !input thermostat
    from: "unavailable"
    id: recovery
conditions:
  - condition: template
    value_template: >-
      {{ is_state(enabled, 'on') or
         (trigger is defined and trigger.id == 'disable') }}
actions:
  - if:
      - condition: template
        value_template: "{{ trigger is defined and trigger.id == 'enable' }}"
    then:
      - action: input_datetime.set_datetime
        target:
          entity_id: !input cycle_start
        data:
          timestamp: "{{ as_timestamp(now()) }}"
  - condition: template
    value_template: >-
      {{ states(thermostat) in ['heat', 'off'] and
         states(reservation) in ['on', 'off'] }}
  - if:
      - condition: template
        value_template: "{{ is_state(reservation, 'on') }}"
    then:
      - action: switch.turn_off
        target:
          entity_id: !input reservation
  - variables:
      anchor: "{{ state_attr(cycle_start, 'timestamp') | float(0) }}"
      period: "{{ (interval_hours | int) * 60 }}"
  - if:
      - condition: template
        value_template: >-
          {{ is_state(enabled, 'on') and
             (anchor <= 0 or interval_hours | int < 1 or interval_hours | int > 24 or
              run_minutes | int < 1 or run_minutes | int > 59 or
              run_minutes | int >= period) }}
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input thermostat
        data:
          hvac_mode: "off"
      - stop: 시작 시각·주기·가동 시간을 확인하세요.
        error: true
  - variables:
      desired: >-
        {% set elapsed = ((as_timestamp(now()) - anchor) / 60) | int %}
        {{ 'heat' if is_state(enabled, 'on') and elapsed >= 0 and
           elapsed % period < run_minutes | int else 'off' }}
  - if:
      - condition: template
        value_template: "{{ states(thermostat) != desired }}"
    then:
      - action: climate.set_hvac_mode
        target:
          entity_id: !input thermostat
        data:
          hvac_mode: "{{ desired }}"
